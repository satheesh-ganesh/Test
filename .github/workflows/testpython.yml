name: python matrix
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        versions: ["3.10","3.11","3.12"]
    steps:
      - name: install-python
        uses: actions/setup-python@v7.0.0
        with:
          python-versions: ${{ matrix.versions }}

 
